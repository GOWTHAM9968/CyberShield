<!DOCTYPE html>
<html>
<head>
<title>CyberShield Login</title>
<link rel="stylesheet"
href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="box">

<h1>CyberShield</h1>

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<a href="/register">
Create Account
</a>

</div>

</body>
</html>
