<!DOCTYPE html>
<html>
<head>

<title>CyberShield Reports</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="box">

<h1>Security Reports</h1>

<table>

<tr>
    <th>ID</th>
    <th>Incident</th>
    <th>Severity</th>
    <th>Description</th>
</tr>

{% for incident in incidents %}

<tr>
    <td>{{ incident[0] }}</td>
    <td>{{ incident[1] }}</td>
    <td>{{ incident[2] }}</td>
    <td>{{ incident[3] }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard">
Dashboard
</a>

</div>

</body>
</html>
